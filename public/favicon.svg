<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Sky-blue rounded backdrop -->
  <rect width="32" height="32" rx="4" fill="#7ec8e3"/>

  <!-- Left dirt face (darker, in shadow) -->
  <polygon points="6,11 16,16 16,26 6,21" fill="#5a3a1a"/>
  <!-- Left grass strip -->
  <polygon points="6,11 16,16 16,18 6,13" fill="#266a26"/>

  <!-- Right dirt face (lit) -->
  <polygon points="16,16 26,11 26,21 16,26" fill="#7a5a3a"/>
  <!-- Right grass strip -->
  <polygon points="16,16 26,11 26,13 16,18" fill="#3c9c3c"/>

  <!-- Top grass face -->
  <polygon points="16,6 26,11 16,16 6,11" fill="#3c9c3c"/>

  <!-- Pixel speckles for that mined-look texture -->
  <rect x="11" y="9"  width="1" height="1" fill="#2d7a2d"/>
  <rect x="18" y="8"  width="1" height="1" fill="#4aaa4a"/>
  <rect x="14" y="12" width="1" height="1" fill="#2d7a2d"/>
  <rect x="20" y="13" width="1" height="1" fill="#4aaa4a"/>

  <rect x="19" y="15" width="1" height="1" fill="#5a3a1a"/>
  <rect x="22" y="18" width="1" height="1" fill="#8a6a4a"/>
  <rect x="18" y="22" width="1" height="1" fill="#5a3a1a"/>
  <rect x="24" y="16" width="1" height="1" fill="#6a4a2a"/>

  <rect x="9"  y="15" width="1" height="1" fill="#3a2a10"/>
  <rect x="12" y="20" width="1" height="1" fill="#7a5a3a"/>
  <rect x="14" y="23" width="1" height="1" fill="#3a2a10"/>
</svg>
